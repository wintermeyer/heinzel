name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Full fixture matrix for the taboo guard, including the
      # check that every hook in settings.json is registered via
      # $CLAUDE_PROJECT_DIR (issue #2: a relative path fails open
      # after any cd).
      - name: Guard test matrix
        run: sh .claude/hooks/guard-taboos-test.sh

      # port-check.md, activity-check.md and the other
      # cross-cutting rules point to sections of the OS files by
      # name. An OS file without one leaves heinzel with no
      # command on that host.
      - name: OS rule files carry every section
        run: sh bin/heinzel-lint-rules

      - name: Validate tracked JSON files
        run: |
          git ls-files '*.json' | while read -r f; do
            echo "checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Shell syntax check
        run: |
          for f in bin/* .claude/hooks/*.sh; do
            echo "checking $f"
            sh -n "$f"
          done

      - name: ShellCheck (error severity)
        run: shellcheck -S error bin/* .claude/hooks/*.sh

  macos-cleanup-scanner:
    # The skill runs the Command Line Tools Python.
    # This job uses that same /usr/bin/python3.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scanner unit tests
        run: >-
          /usr/bin/python3 -m unittest discover -v
          -s .claude/skills/heinzel-macos-cleanup/scripts

      - name: Scanner smoke run
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 .claude/skills/heinzel-macos-cleanup/scripts/scan.py orphans > scan.json
          /usr/bin/python3 -m json.tool scan.json > /dev/null
